  " fill="#ffffff"/>
  <!-- Code bracket accents: left < -->
  <path d="M 82 256 L 56 280 L 82 304" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code bracket accents: right > -->
  <path d="M 430 256 L 456 280 L 430 304" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
